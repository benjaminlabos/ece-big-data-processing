name: gr04-imdb-preparation

services:
  preparation:
    # Reuse the exact base image from TP05, without Kafka or notebook servers.
    image: quay.io/jupyter/pyspark-notebook@sha256:80430186e2e97c5e0a9a3c117798d4007bc0a289b8a72cf3a9fc92f044b4c4f1
    init: true
    entrypoint: []
    command: ["python", "-m", "imdb_preparation.prepare", "--help"]
    working_dir: /home/jovyan/project
    volumes:
      - .:/home/jovyan/project
    environment:
      PYSPARK_PYTHON: python
      SPARK_LOCAL_IP: 127.0.0.1
