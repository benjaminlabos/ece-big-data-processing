name: Finalize IMDb outputs for student review

on:
  push:
    branches: [feat/imdb-full-analysis]
    paths:
      - .github/workflows/imdb-finalize.yml
      - .github/imdb-finalize-request.json
  workflow_dispatch:

# Same group as the source workflow: wait without allocating a runner.
concurrency:
  group: imdb-complete-cloud
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  PYSPARK_PYTHON: python
  PYSPARK_SUBMIT_ARGS: --driver-memory 5g pyspark-shell
  SPARK_LOCAL_IP: 127.0.0.1
  SPARK_LOCAL_DIRS: /tmp/imdb-spark
  PYTHONUNBUFFERED: '1'

jobs:
  # Resume only absent immutable checkpoints from the exact upstream snapshot.
  recover_relations:
    name: Recover five-table checkpoint if the batch stopped early
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned recovery request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          r = json.loads(Path('.github/imdb-finalize-request.json').read_text())
          run = json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{int(r['source_run_id'])}"]))
          assert run['head_sha'] == r['source_commit']
          assert run['head_branch'] == 'feat/imdb-full-analysis'
          assert run['status'] == 'completed' and run['conclusion'] in ('success','failure')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"run_id={r['source_run_id']}\ncommit={r['source_commit']}\n")
          PYTHON
      - uses: actions/cache/restore@v4
        id: complete
        with:
          path: results/cloud-prepared
          key: imdb-${{ steps.source.outputs.run_id }}-prepared-v1
          lookup-only: true
      - uses: actions/cache/restore@v4
        id: relations
        if: steps.complete.outputs.cache-hit != 'true'
        with:
          path: results/cloud-checkpoint-relations
          key: imdb-${{ steps.source.outputs.run_id }}-relations-v1
          lookup-only: true
      - uses: actions/checkout@v4
        if: steps.complete.outputs.cache-hit != 'true' && steps.relations.outputs.cache-hit != 'true'
        with:
          ref: ${{ steps.source.outputs.commit }}
      - uses: ./.github/actions/imdb-runtime
        if: steps.complete.outputs.cache-hit != 'true' && steps.relations.outputs.cache-hit != 'true'
      - uses: actions/cache/restore@v4
        if: steps.complete.outputs.cache-hit != 'true' && steps.relations.outputs.cache-hit != 'true'
        with:
          path: |
            data/raw/cloud-full
            results/cloud-profile
          key: imdb-${{ steps.source.outputs.run_id }}-sources-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: steps.complete.outputs.cache-hit != 'true' && steps.relations.outputs.cache-hit != 'true'
        with:
          path: results/cloud-checkpoint-parents
          key: imdb-${{ steps.source.outputs.run_id }}-parents-v1
          fail-on-cache-miss: true
      - name: Resume the five-table preparation from verified parents
        if: steps.complete.outputs.cache-hit != 'true' && steps.relations.outputs.cache-hit != 'true'
        timeout-minutes: 330
        run: |
          set -euo pipefail
          python -m imdb_preparation.prepare --raw-dir data/raw/cloud-full --output results/cloud-checkpoint-relations --resume-from results/cloud-checkpoint-parents --raw-profile results/cloud-profile --master 'local[4]' --shuffle-partitions 64 --input-partitions 64 --as-of-year 2026 --stop-after title.episode 2>&1 | tee results/recovery-relations.log
      - uses: actions/cache/save@v4
        if: steps.complete.outputs.cache-hit != 'true' && steps.relations.outputs.cache-hit != 'true'
        with:
          path: results/cloud-checkpoint-relations
          key: imdb-${{ steps.source.outputs.run_id }}-relations-v1
      - uses: ./.github/actions/imdb-diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 3

  recover_principals:
    name: Recover seven-table preparation if necessary
    needs: recover_relations
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Read exact upstream request
        id: source
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          r = json.loads(Path('.github/imdb-finalize-request.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"run_id={int(r['source_run_id'])}\ncommit={r['source_commit']}\n")
          PYTHON
      - uses: actions/cache/restore@v4
        id: complete
        with:
          path: results/cloud-prepared
          key: imdb-${{ steps.source.outputs.run_id }}-prepared-v1
          lookup-only: true
      - uses: actions/checkout@v4
        if: steps.complete.outputs.cache-hit != 'true'
        with:
          ref: ${{ steps.source.outputs.commit }}
      - uses: ./.github/actions/imdb-runtime
        if: steps.complete.outputs.cache-hit != 'true'
      - uses: actions/cache/restore@v4
        if: steps.complete.outputs.cache-hit != 'true'
        with:
          path: |
            data/raw/cloud-full
            results/cloud-profile
          key: imdb-${{ steps.source.outputs.run_id }}-sources-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: steps.complete.outputs.cache-hit != 'true'
        with:
          path: results/cloud-checkpoint-relations
          key: imdb-${{ steps.source.outputs.run_id }}-relations-v1
          fail-on-cache-miss: true
      - name: Resume credits and ratings from the five verified tables
        if: steps.complete.outputs.cache-hit != 'true'
        timeout-minutes: 330
        run: |
          set -euo pipefail
          python -m imdb_preparation.prepare --raw-dir data/raw/cloud-full --output results/cloud-prepared --resume-from results/cloud-checkpoint-relations --raw-profile results/cloud-profile --master 'local[4]' --shuffle-partitions 64 --input-partitions 64 --as-of-year 2026 2>&1 | tee results/recovery-prepare.log
      - uses: actions/cache/save@v4
        if: steps.complete.outputs.cache-hit != 'true'
        with:
          path: results/cloud-prepared
          key: imdb-${{ steps.source.outputs.run_id }}-prepared-v1
      - uses: ./.github/actions/imdb-diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 3

  finalize:
    needs: recover_principals
    name: Verify results and prepare the Benjamin handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/imdb-runtime
      - name: Check postprocessing contracts on controlled data
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_cloud.py tests/test_languages.py | tee results/finalization-tests.log
      - name: Validate the exact upstream run
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          request = json.loads(Path('.github/imdb-finalize-request.json').read_text())
          run_id = int(request['source_run_id'])
          commit = request['source_commit']
          assert re.fullmatch('[0-9a-f]{40}', commit)
          assert request['student_validated'] is False
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          source = api(f'actions/runs/{run_id}')
          assert source['head_sha'] == commit and source['head_branch'] == 'feat/imdb-full-analysis'
          assert source['status'] == 'completed' and source['conclusion'] in ('success', 'failure')
          # The recovery jobs may have completed the pinned checkpoint after a diagnostics failure.
          # finalize.py still requires SUCCESS.json, seven tables and matching analysis hashes.
          artifacts = api(f'actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          names = [a['name'] for a in artifacts if not a['expired'] and re.fullmatch(f'imdb-verified-{run_id}-[0-9]+', a['name'])]
          verified = max(names, key=lambda name: int(name.rsplit('-', 1)[1])) if names else ''
          Path('results/finalization-parent.json').write_text(json.dumps({'run_id': run_id, 'commit': commit, 'conclusion': source['conclusion'], 'verified_artifact': verified}, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'source_id={run_id}\nverified_artifact={verified}\n')
          PY
      - uses: actions/cache/restore@v4
        with:
          path: results/cloud-prepared
          key: imdb-${{ steps.request.outputs.source_id }}-prepared-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: imdb-raw-profile-${{ steps.request.outputs.source_id }}
          path: results/cloud-profile
          run-id: ${{ steps.request.outputs.source_id }}
          github-token: ${{ github.token }}
      - name: Fetch the parent's verified derived outputs
        if: steps.request.outputs.verified_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.verified_artifact }}
          path: artifacts/verified
          run-id: ${{ steps.request.outputs.source_id }}
          github-token: ${{ github.token }}
      - name: Restore language reference if analysis needs retrying
        id: language
        if: steps.request.outputs.verified_artifact == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: imdb-original-languages-${{ steps.request.outputs.source_id }}
          path: data/reference
          run-id: ${{ steps.request.outputs.source_id }}
          github-token: ${{ github.token }}
      - name: Validate restored language records or recollect bounded pages
        id: language_input
        if: steps.request.outputs.verified_artifact == ''
        timeout-minutes: 20
        run: |
          python - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          from imdb_preparation.languages import collect, validate_snapshot, restore_reference_archive
          source = Path('data/reference/cloud-original-languages.csv')
          try:
              metadata = validate_snapshot(source)
          except (ValueError, OSError, KeyError) as error:
              print(f'Reference needs recollection: {error}', flush=True)
              archive = Path('references/wikidata-p364-2026-11-11.tar.gz')
              if archive.exists():
                  source, metadata = restore_reference_archive(archive, Path('data/reference/validated-historical'))
              else:
                  source = Path('data/reference/recovered-original-languages.csv')
                  metadata = collect(source)
                  validate_snapshot(source)
          destination = Path('artifacts/reference')
          destination.mkdir(parents=True, exist_ok=True)
          for file in (source, source.with_suffix('.manifest.json'), source.with_name(metadata['vocabulary_path'])):
              shutil.copyfile(file, destination / file.name)
          (destination / 'REFERENCE_REUSE.json').write_text(json.dumps({'source': str(source), 'sha256': metadata['sha256'], 'rows': metadata['rows'], 'collection_method': metadata.get('collection_method', 'original_single_response_snapshot'), 'validation': 'all CSV records, row count, original manifest and vocabulary hashes'}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'path={source}\n')
          PYTHON
      - name: Retry analysis once if prepared data succeeded but output is absent
        if: steps.request.outputs.verified_artifact == ''
        timeout-minutes: 180
        run: |
          set -euo pipefail
          python -m imdb_preparation.explore --prepared-dir results/cloud-prepared --output results/cloud-analysis --config examples/exploration/provisional.json --original-languages "${{ steps.language_input.outputs.path }}" --shuffle-partitions 64 2>&1 | tee results/finalization-analysis.log
      - name: Retry missing integration exports
        if: steps.request.outputs.verified_artifact == ''
        timeout-minutes: 60
        run: |
          set -euo pipefail
          python -m imdb_preparation.exports --prepared-dir results/cloud-prepared --output results/cloud-credits --selected-titles results/cloud-analysis/selected_titles.csv 2>&1 | tee results/finalization-exports.log
          python -m imdb_preparation.cloud package
      - name: Cross-check rankings, compare thresholds and rebuild bounded inputs
        timeout-minutes: 80
        run: |
          set -euo pipefail
          python -m imdb_preparation.finalize 2>&1 | tee results/finalization-handoff.log
          cp results/finalization-parent.json artifacts/handoff/
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads(Path('artifacts/handoff/READY_FOR_REVIEW.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Verified provisional handoff: {s['films']} films, {s['input_pairs']} bounded film-person pairs, {s['thresholds_compared']} threshold combinations.\n\nSelection criteria and result interpretations still require student review.\n")
          PY
      - name: Audit all materialized query outputs and export bounded CSV review tables
        id: query_review
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python -m imdb_preparation.review_outputs 2>&1 | tee results/query-review.log
      - name: Back up available outputs in the run-scoped cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: artifacts
          key: imdb-${{ steps.request.outputs.source_id }}-handoff-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve available derived outputs and the handoff
        if: always()
        id: delivery
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: imdb-completed-for-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish machine outputs on Nicolas's existing PR branch
        if: success() && steps.query_review.outcome == 'success'
        env:
          SOURCE_ID: ${{ steps.request.outputs.source_id }}
        run: |
          set -euo pipefail
          git fetch origin feat/imdb-full-analysis
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Branch moved; verified files remain in the artifact for review.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -B feat/imdb-full-analysis "$GITHUB_SHA"
          publish_dir="validation/overnight-${SOURCE_ID}"
          mkdir -p "$publish_dir"
          cp artifacts/handoff/*.csv artifacts/handoff/*.json "$publish_dir/"
          mkdir -p "$publish_dir/query-review"
          cp artifacts/query-review/*.csv artifacts/query-review/*.json "$publish_dir/query-review/"
          git add -- "$publish_dir"
          git -c user.name='Nicolas Rihana' -c user.email='nrihana1@gmail.com' commit --only -m 'Record verified overnight IMDb outputs for student review' -- "$publish_dir"
          git push origin HEAD:refs/heads/feat/imdb-full-analysis
      - uses: ./.github/actions/imdb-diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 3
      - name: Report an unavailable artifact service after preserving branch outputs
        if: steps.delivery.outcome == 'failure'
        run: |
          echo '::error::Artifact upload failed; check the run-scoped handoff cache and the branch CSV/JSON outputs.'
          exit 1
