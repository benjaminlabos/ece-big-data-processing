name: Verify proposed IMDb credits

on:
  pull_request:
    branches: [feat/imdb-full-analysis]
    paths:
      - .github/workflows/imdb-credit-projection.yml
      - validation/credit-projection/**

permissions:
  contents: read

jobs:
  project-credits:
    if: github.head_ref == 'codex/imdb-credit-projection' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: results/cloud-prepared
          key: imdb-43093003953-prepared-v1
          fail-on-cache-miss: true
      - name: Read the credit projection only
        run: |
          python -m pip install pyarrow==21.0.0
          python validation/credit-projection/project_credits.py results/cloud-prepared validation/credit-projection/requested-pairs.csv credit-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: verified-proposed-imdb-credits
          path: credit-evidence/
          if-no-files-found: error
          retention-days: 7
