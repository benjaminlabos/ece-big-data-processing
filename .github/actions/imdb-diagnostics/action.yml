name: IMDb diagnostics
description: Save bounded logs and manifests, including after a failed phase
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: imdb-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          results/*.log
          results/*/progress.json
          results/*/checkpoint_context.json
          results/*/summary.json
          results/cloud-profile/*.json
          data/raw/cloud-full/manifest.json
          data/reference/*.manifest.json
        if-no-files-found: warn
        retention-days: 7
